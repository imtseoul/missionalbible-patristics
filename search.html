on":"유스티노스의 설명","group":"성경 낭독과 공동 예배","passages":3},{"id":"barnabas-318","title":"숫자 318과 예수의 이름","summary":"아브라함의 집안사람 수를 그리스 문자의 수값으로 풀어 예수와 십자가에 연결하는 대목입니다.","attribution":"『바르나바 서신』 저자의 숫자와 문자 해석","group":"성경의 인용과 해석","passages":2},{"id":"barnabas-water-tree","title":"물과 나무를 세례와 십자가로 읽기","summary":"시편의 물길 곁 나무와 열매, 잎의 표현을 인용하고 각각의 뜻을 풀이합니다.","attribution":"『바르나바 서신』 저자의 시편 인용과 해설","group":"성경의 인용과 해석","passages":4},{"id":"barnabas-jesus-joshua","title":"눈의 아들과 예수의 이름","summary":"그리스어에서 같은 이름으로 불리는 여호수아와 예수를 연결하는 논증입니다.","attribution":"『바르나바 서신』 저자의 모세 전승 해석","group":"성경의 인용과 해석","passages":3},{"id":"barnabas-eighth-day","title":"안식일과 여덟째 날","summary":"창조의 날들과 천 년, 다가올 안식과 예수의 부활을 연결합니다.","attribution":"『바르나바 서신』 저자의 창조와 안식 해석","group":"성경 낭독과 공동 예배","passages":5},{"id":"barnabas-temple","title":"성전의 파괴와 마음에 세워지는 성전","summary":"건물로서의 성전에서 죄의 용서, 새 창조와 말씀으로 이어지는 저자의 해석을 읽습니다.","attribution":"『바르나바 서신』 저자의 성전 논증","group":"성경의 인용과 해석","passages":6},{"id":"second-clement-scripture-gospel","title":"성경과 복음서로 소개되는 예수의 말씀","summary":"‘또 다른 성경’과 ‘복음서에서’라는 인용 도입 뒤에 나오는 예수의 말씀을 읽습니다.","attribution":"『클레멘스 2서』 설교자의 인용과 권면","group":"신약 문헌의 수용","passages":2},{"id":"second-clement-peter-dialogue","title":"어린양과 늑대, 베드로와 예수의 문답","summary":"위험에 처한 어린양을 묻는 베드로의 질문과 죽음 이후의 권세에 관한 예수의 답변입니다.","attribution":"『클레멘스 2서』가 전하는 베드로와 예수의 문답","group":"복음서의 전승과 인용","passages":3},{"id":"second-clement-two-one","title":"둘이 하나가 된다는 말씀의 해석","summary":"나라가 오는 때에 관한 말씀을 진실한 관계, 안과 밖의 일치, 형제자매의 관계로 풀이합니다.","attribution":"예수에게 귀속한 말씀과 『클레멘스 2서』 설교자의 해설","group":"성경의 인용과 해석","passages":5},{"id":"second-clement-church-body","title":"교회와 그리스도의 몸","summary":"창세기의 남자와 여자를 교회와 그리스도에 연결하고 육신과 영에 참여하는 일을 설명합니다.","attribution":"『클레멘스 2서』 설교자의 창조 본문과 교회 해석","group":"성경의 인용과 해석","passages":6},{"id":"second-clement-reading-exhortation","title":"공동체에서 읽는 권면과 모임 이후의 실천","summary":"장로들의 권면을 듣는 모임, 귀가 이후의 생활, 청중에게 글을 읽어 주는 장면을 함께 읽습니다.","attribution":"『클레멘스 2서』 설교자와 청중의 상황","group":"성경 낭독과 공동 예배","passages":2},{"id":"clement-vine-waiting","title":"포도나무로 설명하는 기다림","summary":"두 마음을 품는 이들에 대한 경고와 포도나무의 결실을 두 문헌의 인용 형태로 비교합니다.","attribution":"『클레멘스 1서』와 『클레멘스 2서』가 전하는 예언의 말씀","group":"성경의 인용과 해석","passages":5},{"id":"polycarp-gospel-martyrdom","title":"복음에 따르는 순교","summary":"예수의 수난을 따라 기다리고 넘겨지는 폴리카르포스의 모습과, 스스로 출두한 코인토스의 사례를 함께 읽습니다.","attribution":"스미르나 교회가 보낸 순교 기록","group":"성경의 인용과 해석","passages":4},{"id":"polycarp-confession-authority","title":"카이사르 앞에서의 고백과 통치자에 대한 존경","summary":"카이사르를 주님으로 부르라는 요구, 여든여섯 해의 신앙 고백, 통치자에게 표할 존경의 범위를 다룹니다.","attribution":"폴리카르포스와 심문자들의 문답, 유세비우스의 인용","group":"초기 그리스도교와 로마 사회","passages":4},{"id":"polycarp-prayer-resurrection","title":"잔에 참여함과 영혼·몸의 부활","summary":"폴리카르포스의 기도에서 제물과 잔, 성령과 부활, 예수 그리스도의 대제사장직이 어떻게 이어지는지 읽습니다.","attribution":"순교 기록이 전하는 폴리카르포스의 기도","group":"성경 낭독과 공동 예배","passages":3},{"id":"polycarp-martyr-memory","title":"순교자를 기억하는 공동체","summary":"그리스도에 대한 경배와 순교자에 대한 사랑, 유골의 보존과 순교일의 기념을 다룹니다.","attribution":"스미르나 교회의 설명과 유세비우스가 보존한 같은 기록","group":"성경 낭독과 공동 예배","passages":4},{"id":"polycarp-copying-traditions","title":"편지를 쓴 사람과 사본을 전한 사람들","summary":"에우아레스토스의 문안 뒤에 붙은 필사 후기와 모스크바 사본의 다른 맺음말을 비교합니다. 이레네우스와 폴리카르포스에 관한 증언도 함께 읽습니다.","attribution":"편지의 끝맺음, 전승된 필사 후기, 모스크바 사본의 맺음말과 유세비우스의 인용","group":"사도와 교회의 전승","passages":6},{"id":"polycarp-dove-reading","title":"비둘기와 피: 두 전승의 표현","summary":"Lake판 순교 기록의 비둘기와 피에 관한 문장을, 피가 나오는 형태로 전하는 유세비우스의 인용과 비교합니다.","attribution":"Lake가 채택한 순교 기록과 유세비우스 『교회사』의 인용 전승","group":"사도와 교회의 전승","passages":2},{"id":"diognetus-citizenship","title":"고향의 거류민, 하늘의 시민","summary":"지역의 관습을 따르면서도 거류민으로 사는 그리스도인의 모습을 고향·타향·시민이라는 말로 설명합니다.","attribution":"『디오그네토스에게 보낸 편지』의 익명 필자","group":"초기 그리스도교와 로마 사회","passages":3},{"id":"diognetus-soul-world","title":"몸과 영혼, 세상과 그리스도인","summary":"몸과 영혼의 관계를 비유로 삼아 세상에 살며 세상을 사랑하는 그리스도인을 설명합니다.","attribution":"편지 6장의 몸과 영혼 비유","group":"구원과 그리스도인의 삶","passages":4},{"id":"diognetus-exchange","title":"한 사람의 의로움과 많은 사람의 구원","summary":"아들의 보냄과 속량, 죄를 덮는 의로움을 교환이라는 말로 표현합니다.","attribution":"편지 9장의 구원에 관한 설명","group":"구원과 그리스도인의 삶","passages":6},{"id":"diognetus-imitation","title":"이웃의 짐을 지며 하나님을 본받기","summary":"하나님을 사랑하고 그분의 인자하심을 본받는 일을 이웃을 돕고 가진 것을 나누는 행동으로 풀이합니다.","attribution":"편지 10장의 실천에 관한 권면","group":"구원과 그리스도인의 삶","passages":3},{"id":"diognetus-scripture-tradition","title":"사도들의 제자와 전승의 가르침","summary":"자신을 사도들의 제자라 부르는 화자의 말과 율법·예언자·복음서·사도 전승의 열거를 읽습니다.","attribution":"Lake가 앞부분과 구별해 설명한 11-12장 가운데 11장의 화자","group":"사도와 교회의 전승","passages":3},{"id":"diognetus-trees","title":"지식의 나무와 생명의 나무","summary":"창세기의 두 나무를 지식과 생명, 불순종과 사랑의 관계로 풀이하고 고린도전서의 말을 인용합니다.","attribution":"전승된 마지막 두 장 가운데 12장의 해석","group":"성경의 인용과 해석","passages":4},{"id":"justin-second-trial","title":"그리스도인이라는 이름과 재판","summary":"개종한 여성의 혼인 문제에서 프톨레마이오스와 루키오스의 재판으로 이어지는 사건을 읽습니다. 유세비우스가 인용한 형태도 함께 볼 수 있습니다.","attribution":"유스티노스의 제2변증서와 유세비우스의 인용","group":"초기 그리스도교와 로마 사회","passages":3},{"id":"justin-second-crescens","title":"크레스켄스와 유스티노스의 죽음에 관한 예상","summary":"크레스켄스를 비판하며 자신의 죽음을 예상하는 발언과 유세비우스가 그 말을 배치한 맥락을 비교합니다.","attribution":"Rauschen판 제2변증서 8장(ANF 3장)과 유세비우스의 인용","group":"초기 그리스도교와 로마 사회","passages":3},{"id":"justin-second-logos","title":"로고스의 씨앗과 온전한 로고스","summary":"철학자들이 얻은 부분적 통찰과 그리스도에 관한 유스티노스의 설명을 두 변증서에서 함께 읽습니다.","attribution":"유스티노스의 두 변증서","group":"성경의 인용과 해석","passages":5},{"id":"justin-second-names","title":"하나님의 호칭과 그리스도·예수의 이름","summary":"아버지와 창조자라는 호칭, 그리스도와 예수라는 이름의 뜻을 설명하는 대목입니다.","attribution":"Rauschen판 제2변증서 5장(ANF 6장)","group":"성경의 인용과 해석","passages":1},{"id":"justin-second-world","title":"그리스도인과 세상의 존속","summary":"유스티노스는 그리스도인들의 씨앗과 세상의 존속을 연결하고 선택과 책임을 논합니다. 디오그네토스 서신의 세상을 붙드는 비유도 함께 읽습니다.","attribution":"유스티노스의 설명과 익명 서신의 관련 비유","group":"구원과 그리스도인의 삶","passages":2},{"id":"justin-second-witness","title":"죽음을 대하는 태도와 비방에 대한 답변","summary":"유스티노스가 그리스도인들의 삶을 관찰했다고 말하는 대목과, 그들에게 씌워진 혐의에 대한 반박을 읽습니다.","attribution":"유스티노스의 자기 진술과 유세비우스의 인용","group":"초기 그리스도교와 로마 사회","passages":2},{"id":"athenagoras-enemies","title":"원수 사랑과 일상의 실천","summary":"원수 사랑의 인용과 배우지 못한 신자들의 실천을 디다케의 권면과 함께 읽습니다.","attribution":"아테나고라스의 설명과 본문 인용","group":"구원과 그리스도인의 삶","passages":3},{"id":"athenagoras-father-son-spirit","title":"아버지·아들·성령과 말씀","summary":"말씀의 기원과 잠언 인용, 연합과 구별에 관한 설명을 유스티노스의 예배 설명과 함께 읽습니다.","attribution":"아테나고라스의 설명과 본문 인용","group":"삼위일체와 신앙 고백","passages":5},{"id":"athenagoras-sacrifice","title":"피 없는 제사와 이성에 합당한 예배","summary":"창조주를 아는 일과 기도, 제사에 관한 세 문헌의 설명을 비교합니다.","attribution":"아테나고라스의 설명과 본문 인용","group":"성경 낭독과 공동 예배","passages":4},{"id":"athenagoras-angels","title":"천사들의 타락과 거인 전승","summary":"여자들을 욕망한 천사와 거인들의 기원을 설명하는 두 변증가의 대목입니다.","attribution":"아테나고라스의 설명과 본문 인용","group":"성경의 인용과 해석","passages":3},{"id":"athenagoras-resurrection","title":"몸의 부활과 심판","summary":"식인 혐의에 대한 답변과 창조·몸의 부활·심판을 다루는 여러 문헌의 논증을 읽습니다.","attribution":"아테나고라스의 청원, 전승상 귀속된 부활 논증, 클레멘스 2서","group":"구원과 그리스도인의 삶","passages":12},{"id":"athenagoras-rulers","title":"통치자를 위한 기도와 평온한 삶","summary":"황제에게 드리는 청원의 맺음말과 클레멘스 1서의 통치자 기도를 연결합니다.","attribution":"아테나고라스의 설명과 본문 인용","group":"초기 그리스도교와 로마 사회","passages":3},{"id":"theophilus-john","title":"요한의 이름과 복음서 첫머리","summary":"요한의 이름을 들어 말씀의 기원을 인용하는 테오필로스와, 요한의 복음서 집필을 설명하는 유세비우스를 읽습니다.","attribution":"테오필로스의 설명과 인용","group":"복음서의 전승과 인용","passages":3},{"id":"theophilus-word-wisdom","title":"말씀·지혜와 창조 이전의 사흘","summary":"내재하는 말씀과 발해지는 말씀, 하나님·말씀·지혜를 창조의 사흘에 연결하는 해석을 읽습니다.","attribution":"테오필로스의 설명과 인용","group":"삼위일체와 신앙 고백","passages":4},{"id":"theophilus-genesis","title":"창세기 그리스어 인용과 창조 해석","summary":"창조의 엿새와 동산의 사건을 길게 인용하고 해석하는 대목입니다.","attribution":"테오필로스의 설명과 인용","group":"성경의 인용과 해석","passages":5},{"id":"theophilus-knowledge","title":"지식의 나무와 인간의 성장","summary":"지식과 생명, 아담의 어린 상태와 선택을 다루는 두 문헌의 해석을 비교합니다.","attribution":"테오필로스의 설명과 인용","group":"성경의 인용과 해석","passages":4},{"id":"theophilus-baptism","title":"물에서 난 생명과 새로 태어나는 씻음","summary":"창조의 물과 축복을 세례에 연결하는 해석을 디다케의 세례 지침과 함께 읽습니다.","attribution":"테오필로스의 설명과 인용","group":"성경 낭독과 공동 예배","passages":2},{"id":"theophilus-law-gospel","title":"율법·예언자·복음서들의 일치","summary":"복음서들을 복수로 부르며 하나님의 한 영으로 연결하고, 욕망과 혼인에 관한 말씀을 인용합니다.","attribution":"테오필로스의 설명과 인용","group":"신약 문헌의 수용","passages":3},{"id":"theophilus-paul","title":"원수 사랑과 권세, 사랑의 빚","summary":"복음의 가르침과 로마서 13장, 디모데전서의 기도 권면에 연결되는 대목을 읽습니다.","attribution":"테오필로스의 설명과 인용","group":"신약 문헌의 수용","passages":3},{"id":"theophilus-aratus","title":"아라토스의 시와 신의 자손","summary":"사도행전 17:28에도 나오는 아라토스의 시를 테오필로스가 인용하는 문맥입니다.","attribution":"테오필로스의 설명과 인용","group":"성경의 인용과 해석","passages":1},{"id":"theophilus-chronology","title":"성경의 오래됨을 논증하는 연대 계산","summary":"모세와 다른 저술가들의 선후 관계, 창조부터의 계보와 합계에 관한 저자의 계산을 읽습니다.","attribution":"테오필로스의 설명과 인용","group":"초기 그리스도교와 로마 사회","passages":3},{"id":"tatian-justin","title":"타티아노스가 전하는 유스티노스와 크레스켄스","summary":"유스티노스를 직접 부르는 대목과 크레스켄스의 위협에 관한 두 사람의 증언을 읽습니다.","attribution":"타티아노스의 설명과 관련 문헌의 증언","group":"초기 그리스도교와 로마 사회","passages":4},{"id":"tatian-john","title":"빛과 어둠, 만물의 창조에 관한 요한복음 인용","summary":"요한복음 1:3·5의 표현을 영혼과 영, 창조에 연결하는 타티아노스와 테오필로스를 함께 읽습니다.","attribution":"타티아노스의 설명과 관련 문헌의 증언","group":"복음서의 전승과 인용","passages":4},{"id":"tatian-word","title":"말씀의 나눔과 횃불의 비유","summary":"말씀의 기원과 창조, 아버지의 능력이 줄어들지 않는다는 설명을 읽습니다.","attribution":"타티아노스의 설명과 관련 문헌의 증언","group":"삼위일체와 신앙 고백","passages":3},{"id":"tatian-author","title":"타티아노스의 전향과 저작 전승","summary":"성경을 받아들인 경위와 아시리아 출신이라는 자기소개를 읽고, 유세비우스가 전한 제자 관계와 별도 저술 디아테사론을 확인합니다.","attribution":"타티아노스의 설명과 관련 문헌의 증언","group":"초기 그리스도교와 로마 사회","passages":4},{"id":"tatian-treasure","title":"감추어진 보물과 성경을 배우는 삶","summary":"감추어진 보물을 파내는 비유와 하나님 말씀에 순종하는 삶을 연결하는 대목입니다. 마태복음 13:44와 함께 읽을 수 있습니다.","attribution":"타티아노스의 설명과 관련 문헌의 증언","group":"성경의 인용과 해석","passages":1},{"id":"tatian-resurrection","title":"영혼과 몸, 부활과 불멸","summary":"영혼과 몸의 관계, 지속과 부활을 각 문헌이 어떻게 설명하는지 비교합니다.","attribution":"타티아노스의 설명과 관련 문헌의 증언 · 아테나고라스에게 전승상 귀속된 부활 논증","group":"구원과 그리스도인의 삶","passages":9},{"id":"tatian-chronology","title":"모세와 그리스 저술가들의 선후 관계","summary":"호메로스의 연대에 관한 여러 견해, 이집트·아르고스의 왕명과 세대 수를 이용하는 저자의 계산을 읽습니다.","attribution":"타티아노스의 설명과 관련 문헌의 증언","group":"초기 그리스도교와 로마 사회","passages":5},{"id":"trinity-creeds","title":"삼위일체: 두 신조의 신앙 고백","summary":"325년 신조와 니케아·콘스탄티노폴리스 신조의 성자·성령 고백을 함께 읽습니다.","attribution":"각 신조와 서신·논설의 고백 및 논증","group":"삼위일체와 신앙 고백","passages":7},{"id":"trinity-homoousios","title":"동일본질과 성자의 나심","summary":"신조와 유세비우스의 회의 설명, 나지안조스의 그레고리오스의 탄생과 나오심에 관한 논증을 비교합니다.","attribution":"각 신조와 서신·논설 및 나지안조스의 그레고리오스의 신학강론 및 아타나시우스의 세라피온 서신","group":"삼위일체와 신앙 고백","passages":16},{"id":"trinity-arius","title":"아리우스의 서신과 니케아의 응답","summary":"아리우스의 자기 설명, 공의회의 고백과 배척 선언을 각각의 화자에 따라 읽습니다.","attribution":"각 신조와 서신·논설의 고백 및 논증","group":"삼위일체와 신앙 고백","passages":5},{"id":"trinity-hypostasis","title":"하나와 세 휘포스타시스","summary":"아타나시오스의 서한, 바실리오스와 나지안조스의 그레고리오스의 논증에서 하나의 본질과 세 위격의 뜻을 살핍니다.","attribution":"각 신조와 서신·논설 및 나지안조스의 그레고리오스의 신학강론","group":"삼위일체와 신앙 고백","passages":11},{"id":"trinity-spirit","title":"성령의 신성과 공동 활동","summary":"신조와 회의 서한, 바실리오스와 두 그레고리오스의 논증에서 성령의 신성과 활동을 함께 읽습니다.","attribution":"각 신조와 서신·논설 및 나지안조스의 그레고리오스의 신학강론 및 아타나시우스의 세라피온 서신","group":"삼위일체와 신앙 고백","passages":33},{"id":"trinity-one-operation","title":"아버지에게서 아들을 통하여 성령 안에서","summary":"생명과 구원의 공동 활동, 아버지와 아들의 뜻, 성령을 통해 드러나는 삼위일체의 관계를 읽습니다.","attribution":"각 신조와 서신·논설 및 나지안조스의 그레고리오스의 신학강론 및 아타나시우스의 세라피온 서신","group":"삼위일체와 신앙 고백","passages":16},{"id":"trinity-distinction","title":"본성의 일치와 위격의 구별","summary":"공통 본성과 위격의 고유한 관계, 시간 없는 탄생과 나오심을 구별하는 논증을 읽습니다.","attribution":"각 신조와 서신·논설 및 나지안조스의 그레고리오스의 신학강론 및 아타나시우스의 세라피온 서신","group":"삼위일체와 신앙 고백","passages":18},{"id":"trinity-incarnation","title":"말씀의 성육신과 온전한 인간성","summary":"신조와 아타나시우스의 문헌, 나지안조스의 그레고리오스의 강론에서 말씀의 실제 몸과 몸·영혼·정신을 취하신 구원을 읽습니다.","attribution":"각 신조와 서신·논설 및 나지안조스의 그레고리오스의 신학강론 및 아타나시우스의 세라피온 서신","group":"삼위일체와 신앙 고백","passages":24},{"id":"trinity-theological-discourse","title":"하나님을 말하는 때와 태도","summary":"신학을 논하는 사람의 준비와 청중과 때, 단계적으로 가르치는 방식과 성령의 안내를 묻습니다.","attribution":"각 신조와 서신·논설 및 나지안조스의 그레고리오스의 신학강론","group":"삼위일체와 신앙 고백","passages":12},{"id":"trinity-doxology","title":"성령과 함께, 성령 안에서 드리는 영광송","summary":"바실리오스의 영광송과 교부 인용, 나지안조스의 그레고리오스의 전치사 논증과 공동 경배를 읽습니다.","attribution":"각 신조와 서신·논설 및 나지안조스의 그레고리오스의 신학강론 및 아타나시우스의 세라피온 서신","group":"삼위일체와 신앙 고백","passages":15},{"id":"trinity-baptism-tradition","title":"세례와 기록되지 않은 교회의 전승","summary":"삼위일체를 고백하는 세례, 교회의 전승과 성경의 뜻, 성령의 점진적인 계시를 함께 읽습니다.","attribution":"각 신조와 서신·논설 및 나지안조스의 그레고리오스의 신학강론 및 아타나시우스의 세라피온 서신","group":"삼위일체와 신앙 고백","passages":18},{"id":"trinity-knowledge","title":"하나님을 아는 길과 인간의 한계","summary":"창조의 질서와 하나님의 본성, 현재의 지식과 미래의 앎, 삼위일체 비유의 쓰임과 한계를 읽습니다.","attribution":"나지안조스의 그레고리오스, 제2-5신학강론 및 아타나시우스의 세라피온 서신","group":"삼위일체와 신앙 고백","passages":26},{"id":"trinity-scriptural-names","title":"신적 이름과 성경의 표현","summary":"하나님의 이름과 실재의 관계, 그리스도에 관한 높은 표현과 낮은 표현, 성령의 성경 증언을 함께 읽습니다.","attribution":"나지안조스의 그레고리오스, 제3-5신학강론 및 아타나시우스의 세라피온 서신","group":"삼위일체와 신앙 고백","passages":36},{"id":"trinity-spirit-blasphemy","title":"성령 모독과 베엘제불 논쟁","summary":"세라피온 서신의 성령 모독 경고, 선행 해석과 세례 후의 회개, 그리스도의 신성과 베엘제불 논쟁을 함께 읽습니다.","attribution":"아타나시우스에게 전해지는 세라피온 서신의 논증과 성령 모독 해설","group":"삼위일체와 신앙 고백","passages":19},{"id":"trinity-adoption-participation","title":"성령의 참여와 아들 됨","summary":"거룩하게 하는 성령과 거룩하게 되는 피조물, 인장과 형상, 신적 본성의 참여와 아들 됨을 읽습니다.","attribution":"아타나시우스의 세라피온 서신과 나지안조스의 그레고리오스의 성령 논증","group":"삼위일체와 신앙 고백","passages":12},{"id":"clement-paul-corinthians","title":"클레멘스가 권하는 바울의 고린도 서신","summary":"바울의 편지를 다시 읽으라는 권면과, 바울·게바·아폴로를 둘러싼 고린도 교회의 분열에 관한 설명을 읽습니다.","attribution":"클레멘스 1서의 화자가 고린도인들에게 하는 권면","group":"신약 문헌의 수용","passages":4},{"id":"resurrection-creation-purpose","title":"창조의 목적과 사람의 지속","summary":"창조주의 뜻과 사람의 본성을 근거로 부활을 설명하고, 심판만이 부활의 원인은 아니라고 말하는 대목입니다.","attribution":"아테나고라스에게 전승상 귀속된 부활 논증","group":"구원과 그리스도인의 삶","passages":5},{"id":"resurrection-body-soul-judgment","title":"몸과 영혼의 심판, 사람에게 주어진 법","summary":"몸을 통해 행한 일에 대한 대가와 부모 공경·간음 금지 명령을 영혼과 몸으로 이루어진 사람에게 적용합니다.","attribution":"아테나고라스에게 전승상 귀속된 부활 논증","group":"성경의 인용과 해석","passages":7},{"id":"idols-creator"
